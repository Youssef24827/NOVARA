
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages | NOVARA</title>
  <link rel="stylesheet" href="style.css">
  <script>
    document.documentElement.classList.add("auth-checking");
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</head>
<body>
  <main class="novara-messages">
    <header class="novara-header">
      <h1>💜 NOVARA Messages</h1>
      <p>Discute et retrouve la communauté.</p>
      <a href="index.html">← Retour à l’accueil</a>
    </header>

    <section class="novara-panel">
      <h2>🔎 Trouver un joueur</h2>
      <label for="player-search">Nom d’utilisateur</label>
      <input
        id="player-search"
        type="search"
        placeholder="Rechercher un joueur..."
        autocomplete="off"
      >
      <p id="search-status" role="status">Chargement des profils...</p>
      <div id="player-results"></div>
    </section>

    <section class="novara-panel">
      <h2>💬 Ma messagerie</h2>
      <p id="chat-status" role="status">Sélectionne un joueur pour commencer.</p>
      <div id="message-list" aria-live="polite"></div>
      <form id="message-form">
        <label for="message-input">Ton message</label>
        <textarea
          id="message-input"
          rows="3"
          maxlength="2000"
          placeholder="Écris ton message..."
          required
        ></textarea>
        <button type="submit">Envoyer</button>
      </form>
    </section>

    <section class="novara-panel" id="novara-call-panel">
      <h2>🎧 Appels NOVARA</h2>
      <p>Choisis un joueur dans la recherche avant de lancer un appel.</p>
      <div class="novara-actions">
        <button id="audio-call-button" type="button">🎧 Appel audio</button>
        <button id="video-call-button" type="button">📹 Appel vidéo</button>
      </div>
      <p id="call-status" role="status">Aucun appel en cours.</p>

      <div id="incoming-call" hidden>
        <p id="incoming-call-text">Appel entrant</p>
        <button id="accept-call-button" type="button">Accepter</button>
        <button id="reject-call-button" type="button">Refuser</button>
      </div>

      <div id="call-media" hidden>
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay muted playsinline></video>
        <audio id="remote-audio" autoplay></audio>
        <button id="hangup-button" type="button">Terminer l’appel</button>
      </div>
    </section>
  </main>

  <style>
  html.auth-checking body { visibility: hidden; }

    .chat-layout {
      display: grid;
      grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
      gap: 20px;
      min-height: 520px;
      margin-top: 24px;
    .novara-messages {
      width: min(100% - 28px, 900px);
      margin: 30px auto;
      color: #f5f2ff;
    }

    .chat-panel {
      min-width: 0;
      padding: 20px;
      border: 1px solid rgba(160, 100, 255, .22);
    .novara-header,
    .novara-panel {
      background: #11101b;
      border: 1px solid #673cff;
      border-radius: 16px;
      background: rgba(18, 15, 35, .82);
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 0 18px #673cff18;
    }

    .novara-messages h1,
    .novara-messages h2 {
      color: #b9a1ff;
    }

    .chat-search, .chat-input {
    .novara-messages input,
    .novara-messages textarea {
      box-sizing: border-box;
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      border: 1px solid #40345e;
      border-radius: 10px;
      background: #100d20;
      border: 1px solid #514078;
      border-radius: 9px;
      background: #090812;
      color: white;
      font: inherit;
    }

    .chat-search { margin: 12px 0; }

    .chat-button {
      padding: 10px 14px;
      border: 1px solid #8950ed;
      border-radius: 10px;
      background: #6735bd;
      color: white;
      font: inherit;
    .novara-messages button {
      cursor: pointer;
      border: 1px solid #9a7bff;
      border-radius: 9px;
      padding: 10px 15px;
      margin: 5px 5px 5px 0;
      background: #673cff;
      color: white;
      font-weight: bold;
    }

    .chat-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    .novara-messages button:hover {
      background: #805eff;
    }

    .chat-list {
      display: grid;
    .novara-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .chat-person {
      width: 100%;
    .player-result,
    .message-item {
      border: 1px solid #302644;
      border-radius: 9px;
      padding: 12px;
      border: 1px solid #35294e;
      border-radius: 10px;
      background: #171229;
      color: white;
      text-align: left;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .chat-person:hover { border-color: #a16cff; }

    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 340px;
      overflow-y: auto;
      padding: 12px 0;
    }

    .chat-message {
      max-width: 82%;
      padding: 10px 13px;
      border: 1px solid #40345e;
      border-radius: 12px;
      background: #211a36;
      margin: 8px 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .chat-message.mine {
      align-self: flex-end;
      background: #55309b;
      border-color: #8153ce;
    }

    .chat-message small {
      display: block;
      margin-top: 5px;
      opacity: .7;
      font-size: 11px;
    }

    .chat-compose {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    #remote-video {
      width: 100%;
      max-height: 320px;
      background: #05040a;
      border-radius: 10px;
    }

    .chat-compose .chat-input { flex: 1; min-width: 0; }

    .chat-status {
      color: #c9b9e9;
      font-size: 13px;
      overflow-wrap: anywhere;
    #local-video {
      width: 130px;
      max-height: 110px;
      background: #05040a;
      border-radius: 10px;
    }

    @media (max-width: 700px) {
      .chat-layout { grid-template-columns: 1fr; }
      .chat-messages { height: 300px; }
    .novara-messages a {
      color: #c5b4ff;
    }
  </style>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL =
        "https://smxjkgcxjzomkqwaaxlr.supabase.co";

      // Utilise ici la même clé publishable que dans auth.js.
      const SUPABASE_KEY =
        "sb_publishable_SaIzHbrr-jTPPnFhztD36w_N6o6vuBX";

      const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      const $ = (id) => document.getElementById(id);

      let currentUser = null;
      let selectedProfile = null;
      let activeConversation = null;
      let messageChannel = null;
      let callsChannel = null;
      let activeCall = null;
      let peer = null;
      let localStream = null;
      let remoteStream = null;
      let pendingIce = [];

      const rtcConfig = {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" }
        ]
      };

      function status(id, message) {
        $(id).textContent = message;
      }

      function escapeText(value) {
        return String(value ?? "");
      }

      async function getCurrentUser() {
        const { data, error } = await client.auth.getUser();

        if (error || !data.user) {
          status("search-status", "Connecte-toi pour utiliser NOVARA.");
          return null;
        }

        return data.user;
      }

      async function searchProfiles() {
        if (!currentUser) return;

        const term = $("player-search").value.trim();

        let query = client
          .from("profiles")
          .select("id, username")
          .neq("id", currentUser.id)
          .order("username", { ascending: true })
          .limit(20);

        if (term) {
          query = query.ilike("username", `%${term}%`);
        }

        status("search-status", "Recherche en cours...");

        const { data, error } = await query;

        if (error) {
          console.error("Erreur profils:", error);
          status(
            "search-status",
            "Impossible de charger les joueurs. Vérifie les politiques RLS."
          );
          return;
        }

        const results = $("player-results");
        results.replaceChildren();

        if (!data || data.length === 0) {
          status("search-status", "Aucun autre joueur trouvé.");
          return;
        }

        status("search-status", `${data.length} joueur(s) trouvé(s).`);

        for (const profile of data) {
          const item = document.createElement("div");
          item.className = "player-result";

          const name = document.createElement("strong");
          name.textContent = profile.username || "Joueur NOVARA";

          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "Ouvrir la conversation";

          button.addEventListener("click", async () => {
            selectedProfile = profile;
            await openConversation(profile);
          });

          item.append(name, document.createElement("br"), button);
          results.appendChild(item);
        }
      }

      async function openConversation(profile) {
        status("chat-status", "Ouverture de la conversation...");

        const { data, error } = await client.rpc(
          "create_novara_conversation",
          { other_user_id: profile.id }
        );

        if (error) {
          console.error("Conversation:", error);
          status(
            "chat-status",
            "Impossible d’ouvrir la conversation. Vérifie la fonction SQL."
          );
          return;
        }

        activeConversation = data;
        await loadMessages();
        subscribeMessages();
        status(
          "chat-status",
          `Conversation avec ${profile.username || "ce joueur"}`
        );
      }

      async function loadMessages() {
        if (!activeConversation) return;

        const { data, error } = await client
          .from("messages")
          .select("*")
          .eq("conversation_id", activeConversation)
          .order("created_at", { ascending: true })
          .limit(100);

        if (error) {
          console.error("Messages:", error);
          status("chat-status", "Impossible de charger les messages.");
          return;
        }

        const list = $("message-list");
        list.replaceChildren();

        for (const message of data || []) {
          const item = document.createElement("div");
          item.className = "message-item";

          const author = document.createElement("strong");
          author.textContent =
            message.sender_id === currentUser.id ? "Moi : " : "Joueur : ";

          const content = document.createElement("span");
          content.textContent = escapeText(message.content);

          item.append(author, content);
          list.appendChild(item);
        }

        list.scrollTop = list.scrollHeight;
      }

      function subscribeMessages() {
        if (messageChannel) {
          client.removeChannel(messageChannel);
        }

        messageChannel = client
          .channel("novara-messages-" + activeConversation)
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages",
              filter: "conversation_id=eq." + activeConversation
            },
            () => loadMessages()
          )
          .subscribe();
      }

      $("message-form").addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!currentUser || !activeConversation) {
          status("chat-status", "Sélectionne d’abord un joueur.");
          return;
        }

        const content = $("message-input").value.trim();
        if (!content) return;

        const { error } = await client
          .from("messages")
          .insert({
            conversation_id: activeConversation,
            sender_id: currentUser.id,
            content
          });

        if (error) {
          console.error("Envoi:", error);
          status("chat-status", "Envoi impossible. Vérifie les politiques RLS.");
          return;
        }

        $("message-input").value = "";
        await loadMessages();
      });

      async function createPeer() {
        peer = new RTCPeerConnection(rtcConfig);
        remoteStream = new MediaStream();

        $("remote-video").srcObject = remoteStream;
        $("remote-audio").srcObject = remoteStream;

        peer.ontrack = (event) => {
          for (const track of event.streams[0]?.getTracks() || []) {
            if (!remoteStream.getTracks().some(t => t.id === track.id)) {
              remoteStream.addTrack(track);
            }
          }
        };

        peer.onicecandidate = async (event) => {
          if (!event.candidate || !activeCall) return;

          const { error } = await client
            .from("novara_call_signals")
            .insert({
              call_id: activeCall.id,
              sender_id: currentUser.id,
              signal_type: "ice",
              payload: event.candidate.toJSON()
            });

          if (error) console.error("ICE:", error);
        };

        peer.onconnectionstatechange = () => {
          status("call-status", "Connexion : " + peer.connectionState);
        };

        for (const track of localStream.getTracks()) {
          peer.addTrack(track, localStream);
        }

        return peer;
      }

      async function addPendingIce() {
        if (!peer || !peer.remoteDescription) return;

        const queue = pendingIce.splice(0);

        for (const candidate of queue) {
          try {
            await peer.addIceCandidate(candidate);
          } catch (error) {
            console.error("ICE candidate:", error);
          }
        }
      }

      async function handleSignal(signal) {
        if (!activeCall || !peer) return;
        if (signal.sender_id === currentUser.id) return;
        if (signal.call_id !== activeCall.id) return;

        try {
          if (signal.signal_type === "offer") {
            await peer.setRemoteDescription(signal.payload);
            await addPendingIce();

            const answer = await peer.createAnswer();
            await peer.setLocalDescription(answer);

            const { error } = await client
              .from("novara_call_signals")
              .insert({
                call_id: activeCall.id,
                sender_id: currentUser.id,
                signal_type: "answer",
                payload: answer
              });

            if (error) console.error("Réponse:", error);
          }

          if (signal.signal_type === "answer") {
            await peer.setRemoteDescription(signal.payload);
            await addPendingIce();
          }

          if (signal.signal_type === "ice") {
            if (!peer.remoteDescription) {
              pendingIce.push(signal.payload);
            } else {
              await peer.addIceCandidate(signal.payload);
            }
          }
        } catch (error) {
          console.error("Signal:", error);
          status("call-status", "Erreur de connexion de l’appel.");
        }
      }

      async function subscribeSignals(callId) {
        if (callsChannel) client.removeChannel(callsChannel);

        callsChannel = client
          .channel("novara-signals-" + callId)
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "novara_call_signals",
              filter: "call_id=eq." + callId
            },
            (event) => handleSignal(event.new)
          )
          .subscribe();

        const { data, error } = await client
          .from("novara_call_signals")
          .select("*")
          .eq("call_id", callId)
          .order("created_at", { ascending: true });

        if (error) {
          console.error("Chargement signaux:", error);
          return;
        }

        for (const signal of data || []) {
          await handleSignal(signal);
        }
      }

      async function startCall(type) {
        if (!selectedProfile) {
          status("call-status", "Recherche et sélectionne d’abord un joueur.");
          return;
        }

        if (activeCall) {
          status("call-status", "Un appel est déjà en cours.");
          return;
        }

        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: type === "video"
          });

          $("local-video").srcObject = localStream;
          $("call-media").hidden = false;

          const { data: call, error } = await client
            .from("novara_calls")
            .insert({
              caller_id: currentUser.id,
              receiver_id: selectedProfile.id,
              call_type: type,
              status: "ringing"
            })
            .select()
            .single();

          if (error) throw error;

          activeCall = call;
          pendingIce = [];

          await createPeer();
          await subscribeSignals(call.id);

          const offer = await peer.createOffer();
          await peer.setLocalDescription(offer);

          const { error: signalError } = await client
            .from("novara_call_signals")
            .insert({
              call_id: call.id,
              sender_id: currentUser.id,
              signal_type: "offer",
              payload: offer
            });

          if (signalError) throw signalError;

          $("hangup-button").hidden = false;
          status("call-status", "Appel lancé. En attente du joueur...");
        } catch (error) {
          console.error("Appel:", error);
          status(
            "call-status",
            "Appel impossible. Vérifie les permissions du navigateur et Supabase."
          );
          await cleanup(false);
        }
      }

      async function checkIncomingCalls() {
        if (!currentUser || activeCall) return;

        const { data, error } = await client
          .from("novara_calls")
          .select("*")
          .eq("receiver_id", currentUser.id)
          .eq("status", "ringing")
          .order("created_at", { ascending: false })
          .limit(1);

        if (error || !data?.length) return;

        activeCall = data[0];
        $("incoming-call").hidden = false;
        $("incoming-call-text").textContent =
          "Appel entrant : " + activeCall.call_type;
        $("accept-call-button").hidden = false;
        $("reject-call-button").hidden = false;
        status("call-status", "Un joueur t’appelle.");
      }

      async function acceptCall() {
        if (!activeCall) return;

        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: activeCall.call_type === "video"
          });

          $("local-video").srcObject = localStream;
          $("call-media").hidden = false;

          const { error } = await client
            .from("novara_calls")
            .update({ status: "accepted" })
            .eq("id", activeCall.id);

          if (error) throw error;

          pendingIce = [];
          await createPeer();
          await subscribeSignals(activeCall.id);

          $("incoming-call").hidden = true;
          $("hangup-button").hidden = false;
          status("call-status", "Appel accepté. Connexion en cours...");
        } catch (error) {
          console.error("Acceptation:", error);
          status("call-status", "Impossible d’accepter cet appel.");
          await cleanup(false);
        }
      }

      async function rejectCall() {
        if (!activeCall) return;

        await client
          .from("novara_calls")
          .update({ status: "rejected", ended_at: new Date().toISOString() })
          .eq("id", activeCall.id);

        await cleanup(false);
        status("call-status", "Appel refusé.");
      }

      async function cleanup(updateStatus = true) {
        const callId = activeCall?.id;

        if (updateStatus && callId) {
          await client
            .from("novara_calls")
            .update({
              status: "ended",
              ended_at: new Date().toISOString()
            })
            .eq("id", callId);
        }

        if (peer) peer.close();
        peer = null;

        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
        }

        localStream = null;
        remoteStream = null;
        pendingIce = [];

        $("local-video").srcObject = null;
        $("remote-video").srcObject = null;
        $("remote-audio").srcObject = null;
        $("call-media").hidden = true;
        $("incoming-call").hidden = true;
        $("hangup-button").hidden = true;

        if (callsChannel) client.removeChannel(callsChannel);
        callsChannel = null;
        activeCall = null;
      }

      $("player-search").addEventListener("input", searchProfiles);
      $("audio-call-button").addEventListener("click", () => startCall("audio"));
      $("video-call-button").addEventListener("click", () => startCall("video"));
      $("accept-call-button").addEventListener("click", acceptCall);
      $("reject-call-button").addEventListener("click", rejectCall);
      $("hangup-button").addEventListener("click", () => cleanup(true));

      async function init() {
        currentUser = await getCurrentUser();

        if (!currentUser) return;

        await searchProfiles();
        await checkIncomingCalls();

        setInterval(checkIncomingCalls, 4000);
      }

      init();
    })();
  </script>
</body>
</html>
