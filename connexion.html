
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte — NOVARA</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #08060d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .login-card {
      box-sizing: border-box;
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border: 1px solid #392052;
      border-radius: 18px;
      background: #120d1b;
      box-shadow: 0 0 35px #8b35ff22;
    }

    .login-card h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #b66cff;
    }

    .subtitle {
      margin-bottom: 24px;
      text-align: center;
      color: #b8afc5;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tabs button {
      flex: 1;
      margin: 0;
      padding: 11px 8px;
      border: 1px solid #49335e;
      border-radius: 9px;
      background: #09070e;
      color: #c9bfd5;
      font-size: 14px;
      cursor: pointer;
    }

    .tabs button.active {
      background: #9b4dff;
      border-color: #9b4dff;
      color: #fff;
      font-weight: bold;
    }

    .login-card label {
      display: block;
      margin: 16px 0 8px;
    }

    .login-card input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border: 1px solid #49335e;
      border-radius: 9px;
      background: #09070e;
      color: #fff;
      font-size: 16px;
    }

    .submit-button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #9b4dff;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 16px;
      color: #e3caff;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <main class="login-card">
    <h1>NOVARA</h1>
    <p class="subtitle">Rejoins ton univers gaming.</p>

    <div class="tabs" role="group" aria-label="Choisir une option">
      <button id="signupTab" class="active" type="button" aria-pressed="true">
        Créer un compte
      </button>
      <button id="loginTab" type="button" aria-pressed="false">
        Se connecter
      </button>
    </div>

    <form id="authForm">
      <div id="pseudoGroup">
        <label for="pseudo">Pseudo</label>
        <input
          id="pseudo"
          name="pseudo"
          type="text"
          autocomplete="username"
          minlength="3"
          maxlength="20"
          required
          placeholder="Ton pseudo"
        >
      </div>

      <div id="emailGroup" class="hidden">
        <label for="email">Adresse e-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="ton@email.com"
          disabled
        >
      </div>

      <label for="password">Mot de passe</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="8 caractères minimum"
      >

      <button id="submitButton" class="submit-button" type="submit">
        Créer mon compte
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const signupTab = document.getElementById("signupTab");
    const loginTab = document.getElementById("loginTab");
    const form = document.getElementById("authForm");
    const pseudo = document.getElementById("pseudo");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const emailGroup = document.getElementById("emailGroup");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");

    let mode = "signup";

    function setMode(nextMode) {
      mode = nextMode;

      const isSignup = mode === "signup";

      signupTab.classList.toggle("active", isSignup);
      loginTab.classList.toggle("active", !isSignup);

      signupTab.setAttribute("aria-pressed", String(isSignup));
      loginTab.setAttribute("aria-pressed", String(!isSignup));

      emailGroup.classList.toggle("hidden", isSignup);
      email.disabled = isSignup;
      email.required = !isSignup;

      pseudo.autocomplete = isSignup ? "username" : "off";
      password.autocomplete = isSignup ? "new-password" : "current-password";

      submitButton.textContent = isSignup
        ? "Créer mon compte"
        : "Se connecter";

      document.title = isSignup
        ? "Créer un compte — NOVARA"
        : "Connexion — NOVARA";

      message.textContent = "";
    }

    signupTab.addEventListener("click", () => setMode("signup"));
    loginTab.addEventListener("click", () => setMode("login"));

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      message.textContent = mode === "signup"
        ? "Le formulaire est prêt. L'inscription doit maintenant être reliée à l'authentification sécurisée."
        : "La connexion doit maintenant être reliée à l'authentification sécurisée.";
    });

    setMode("signup");
  </script>
</body>
</html>
