
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — NOVARA</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #08060d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border: 1px solid #392052;
      border-radius: 18px;
      background: #120d1b;
      box-shadow: 0 0 35px #8b35ff22;
    }

    .login-card h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #b66cff;
    }

    .subtitle {
      margin-bottom: 28px;
      text-align: center;
      color: #b8afc5;
    }

    .login-card label {
      display: block;
      margin: 16px 0 8px;
    }

    .login-card input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border: 1px solid #49335e;
      border-radius: 9px;
      background: #09070e;
      color: #fff;
      font-size: 16px;
    }

    .login-card button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #9b4dff;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-card button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 16px;
      color: #e3caff;
      overflow-wrap: anywhere;
    }

    .signup-link {
      margin-top: 22px;
      text-align: center;
      color: #c9bfd5;
    }

    .signup-link a {
      color: #c28aff;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <main class="login-card">
    <h1>NOVARA</h1>
    <p class="subtitle">Connecte-toi à ton univers gaming.</p>

    <form id="loginForm">
      <label for="email">Adresse e-mail</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        required
        placeholder="ton@email.com"
      >

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
        placeholder="Ton mot de passe"
      >

      <button id="loginButton" type="submit">
        Se connecter
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="signup-link">
      Pas encore de compte ?
      <a href="inscription.html">Créer un compte</a>
    </p>
  </main>

  <script>
    const SUPABASE_URL =
      "https://smxjkgcxjzomkqwaaxlr.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_SaIzHbrr-jTPPnFhztD36w_N6o6vuBX";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      button.disabled = true;
      message.textContent = "Connexion en cours…";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { data, error } =
          await client.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          message.textContent =
            "Connexion impossible. Vérifie ton e-mail et ton mot de passe.";
          console.error(error);
          return;
        }

        if (!data.session) {
          message.textContent =
            "Aucune session active. Vérifie ton compte e-mail si nécessaire.";
          return;
        }

        const params = new URLSearchParams(window.location.search);
        const destination = params.get("redirect");

        const pagesAutorisees = [
          "index.html",
          "explorer.html",
          "communautes.html",
          "defis.html",
          "messages.html",
          "profil.html"
        ];

        const pageDemandee = destination
          ? destination.split("?")[0].split("#")[0].split("/").pop()
          : "";

        const destinationSure =
          destination &&
          !destination.startsWith("//") &&
          pagesAutorisees.includes(pageDemandee)
            ? destination
            : "index.html";

        window.location.replace(destinationSure);

      } catch (error) {
        console.error(error);
        message.textContent =
          "Erreur inattendue. Réessaie dans un instant.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
