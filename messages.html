
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages | NOVARA</title>
  <link rel="stylesheet" href="style.css">
  <script>
    document.documentElement.classList.add("auth-checking");
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</head>
<body>
  <main class="novara-messages">
    <header class="novara-header">
      <h1>💜 NOVARA Messages</h1>
      <p>Discute et retrouve la communauté.</p>
      <a href="index.html">← Retour à l’accueil</a>
    </header>

    <section class="novara-panel">
      <h2>🔎 Trouver un joueur</h2>
      <label for="player-search">Nom d’utilisateur</label>
      <input
        id="player-search"
        type="search"
        placeholder="Rechercher un joueur..."
        autocomplete="off"
      >
      <p id="search-status" role="status">Chargement des profils...</p>
      <div id="player-results"></div>
    </section>

    <section class="novara-panel">
      <h2>💬 Ma messagerie</h2>
      <p id="chat-status" role="status">Sélectionne un joueur pour commencer.</p>
      <div id="message-list" aria-live="polite"></div>
      <form id="message-form">
        <label for="message-input">Ton message</label>
        <textarea
          id="message-input"
          rows="3"
          maxlength="2000"
          placeholder="Écris ton message..."
          required
        ></textarea>
        <button type="submit">Envoyer</button>
      </form>
    </section>

    <section class="novara-panel" id="novara-call-panel">
      <h2>🎧 Appels NOVARA</h2>
      <p>Choisis un joueur dans la recherche avant de lancer un appel.</p>
      <div class="novara-actions">
        <button id="audio-call-button" type="button">🎧 Appel audio</button>
        <button id="video-call-button" type="button">📹 Appel vidéo</button>
      </div>
      <p id="call-status" role="status">Aucun appel en cours.</p>

      <div id="incoming-call" hidden>
        <p id="incoming-call-text">Appel entrant</p>
        <button id="accept-call-button" type="button">Accepter</button>
        <button id="reject-call-button" type="button">Refuser</button>
      </div>

      <div id="call-media" hidden>
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay muted playsinline></video>
        <audio id="remote-audio" autoplay></audio>
        <button id="hangup-button" type="button">Terminer l’appel</button>
      </div>
    </section>
  </main>

  <style>
  html.auth-checking body { visibility: hidden; }

    .chat-layout {
      display: grid;
      grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
      gap: 20px;
      min-height: 520px;
      margin-top: 24px;
    }

    .chat-panel {
      min-width: 0;
      padding: 20px;
      border: 1px solid rgba(160, 100, 255, .22);
      border-radius: 16px;
      background: rgba(18, 15, 35, .82);
    }

    .chat-search, .chat-input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #40345e;
      border-radius: 10px;
      background: #100d20;
      color: white;
      font: inherit;
    }

    .chat-search { margin: 12px 0; }

    .chat-button {
      padding: 10px 14px;
      border: 1px solid #8950ed;
      border-radius: 10px;
      background: #6735bd;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .chat-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .chat-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .chat-person {
      width: 100%;
      padding: 12px;
      border: 1px solid #35294e;
      border-radius: 10px;
      background: #171229;
      color: white;
      text-align: left;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .chat-person:hover { border-color: #a16cff; }

    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 340px;
      overflow-y: auto;
      padding: 12px 0;
    }

    .chat-message {
      max-width: 82%;
      padding: 10px 13px;
      border: 1px solid #40345e;
      border-radius: 12px;
      background: #211a36;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .chat-message.mine {
      align-self: flex-end;
      background: #55309b;
      border-color: #8153ce;
    }

    .chat-message small {
      display: block;
      margin-top: 5px;
      opacity: .7;
      font-size: 11px;
    }

    .chat-compose {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .chat-compose .chat-input { flex: 1; min-width: 0; }

    .chat-status {
      color: #c9b9e9;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 700px) {
      .chat-layout { grid-template-columns: 1fr; }
      .chat-messages { height: 300px; }
    }
  </style>
<script>
(() => {
  const missions = [
    [
      { icon: "🎯", title: "Œil de précision", description: "Joue une partie en te concentrant sur la précision.", difficulty: "Facile", xp: 50 },
      { icon: "🧠", title: "Esprit tactique", description: "Essaie une nouvelle stratégie pendant ta partie.", difficulty: "Moyen", xp: 75 },
      { icon: "🤝", title: "Allié fidèle", description: "Privilégie la coopération avec ton équipe.", difficulty: "Moyen", xp: 100 }
    ],
    [
      { icon: "⚡", title: "Réflexes éclair", description: "Reste attentif pendant une partie.", difficulty: "Facile", xp: 50 },
      { icon: "🏆", title: "Objectif victoire", description: "Fais de ton mieux pour atteindre ton objectif.", difficulty: "Moyen", xp: 75 },
      { icon: "🛡️", title: "Coéquipier solide", description: "Aide un coéquipier pendant une partie.", difficulty: "Moyen", xp: 100 }
    ],
    [
      { icon: "🧭", title: "Explorateur", description: "Découvre une zone ou une stratégie nouvelle.", difficulty: "Facile", xp: 50 },
      { icon: "🔥", title: "Persévérance", description: "Termine une partie avec une attitude positive.", difficulty: "Moyen", xp: 75 },
      { icon: "💎", title: "Défi personnel", description: "Essaie d'améliorer ton propre résultat.", difficulty: "Difficile", xp: 100 }
    ]
  ];

  const zone = document.querySelector("#daily-challenges");
  if (!zone) return;

  const now = new Date();
  const dateKey = [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, "0"),
    String(now.getDate()).padStart(2, "0")
  ].join("-");

  const start = new Date(now.getFullYear(), 0, 0);
  const day = Math.floor((now - start) / 86400000);
  const selection = missions[Math.floor((day - 1) / 3) % missions.length];

  const title = zone.querySelector("h2");
  const intro = zone.querySelector(":scope > p");
  const cards = zone.querySelectorAll(".grid .card");
  const note = zone.querySelector(".daily-note");

  title.innerHTML = 'Tes défis quotidiens<span class="gradient">.</span>';
  intro.textContent = "Relève les missions du jour et suis ta progression.";

  let completed = [];

  try {
    completed = JSON.parse(
      localStorage.getItem("novara-defis-" + dateKey) || "[]"
    );
    if (!Array.isArray(completed)) completed = [];
  } catch {
    completed = [];
  }

  function updateProgress() {
    const count = completed.length;
    let progress = zone.querySelector(".daily-progress");

    if (!progress) {
      progress = document.createElement("p");
      progress.className = "daily-progress";
      zone.insertBefore(progress, zone.querySelector(".grid"));
    }

    progress.textContent =
      `Progression : ${count}/3 défis terminés`;
  }

  cards.forEach((card, index) => {
    const mission = selection[index];
    if (!mission) return;

    card.querySelector(".game-icon").textContent = mission.icon;
    card.querySelector("h3").textContent = mission.title;
    card.querySelector("p").textContent = mission.description;

    const tags = card.querySelector(".tags");
    tags.replaceChildren();

    [mission.difficulty, "+" + mission.xp + " XP"].forEach(label => {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = label;
      tags.appendChild(tag);
    });

    let button = card.querySelector(".daily-complete");

    if (!button) {
      button = document.createElement("button");
      button.type = "button";
      button.className = "btn daily-complete";
      card.appendChild(button);
    }

    function renderButton() {
      const done = completed.includes(index);
      button.textContent = done ? "✓ Défi terminé" : "Valider le défi";
      button.disabled = done;
      button.setAttribute("aria-pressed", String(done));
    }

    button.addEventListener("click", () => {
      if (completed.includes(index)) return;

      completed.push(index);

      try {
        localStorage.setItem(
          "novara-defis-" + dateKey,
          JSON.stringify(completed)
        );
      } catch {
        completed.pop();
        alert("Impossible de sauvegarder sur cet appareil.");
        return;
      }

      renderButton();
      updateProgress();

      if (completed.length === 3) {
        if (note) {
          note.textContent =
            "🎉 Bravo ! Tu as validé les trois défis du jour.";
        }
      }
    });

    renderButton();
  });

  updateProgress();

  if (note && completed.length < 3) {
    note.textContent =
      "💜 Validation enregistrée sur cet appareil. Les XP sont indicatifs et ne sont pas crédités à ton compte.";
  } else if (note) {
    note.textContent = "🎉 Bravo ! Tu as validé les trois défis du jour.";
  }
})();
</script>

</body>
</html>
